<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
      <link rel="stylesheet" href="contact.css">
      <link rel="stylesheet" href="style.css">
      <script src="script.js"></script>
</head>
<body>
      <nav>
            <div class="logo">My Bookstore</div>
          
            <div class="menu-toggle">☰</div> <!-- Hamburger icon for mobile -->
          
            <ul>
              <li><a href="books.html">Home</a></li>
              <li><a href="aboutus.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          
            <div class="theme-toggle">
              <span class="sun">☀</span>
              <span class="moon">🌙</span>
            </div>
          </nav>
 <div class="mid">

      <div class="contact-page">
            <div class="contact-header">
                  <h1>Get in Touch</h1>
                  <p>We would love to hear from you! Fill out the form below or contact us through our social media channels.</p>
            </div>

            <div class="contact-content">
                  <div class="contact-details">
                        <h2>Contact Information</h2>
                        <p>Email: <a href="mailto:contact@yourdomain.com">ayushideulkar88@gmail.com</a></p>
                        <p>Phone: <a href="tel:+1234567890">+91-9309283985</a></p>
                  </div>

                  <form onSubmit={handleSubmit} class="contact-form">
                        <div class="form-group">
                              <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="Your Name"
                                    onChange={handleChange}
                                    required
                              />
                        </div>
                        <div class="form-group">
                              <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="Your Email"
                                    onChange={handleChange}
                                    required
                              />
                        </div>
                        <div class="form-group">
                              <textarea
                                    id="message"
                                    name="message"
                                    placeholder="Your Message"
                                    value={formData.message}
                                    onChange={handleChange}
                                    required
                              ></textarea>
                        </div>
                        <button type="submit" class="submit-button">Send Message</button>
                  </form>

                  <div class="social-media">
                        <h2>Follow Us</h2>
                        <div class="social-icons">
                              <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                                    <FontAwesomeIcon icon={faFacebookF} />
                              </a>
                              <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                                    <FontAwesomeIcon icon={faTwitter} />
                              </a>
                              <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                                    <FontAwesomeIcon icon={faInstagram} />
                              </a>
                              <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                                    <FontAwesomeIcon icon={faLinkedinIn} />
                              </a>
                        </div>
                  </div>
            </div>
      </div>
      </div> 
</body>
</html>
